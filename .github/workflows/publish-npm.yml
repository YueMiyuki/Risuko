name: Publish npm packages

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.2)'
        required: true
      dry_run:
        description: 'Dry run (skip actual publish)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  meta:
    name: Resolve version
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'release' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Require every app build of the release to have succeeded
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          jobs=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
            --jq '.jobs[] | select(.name | test("^(Release \\(|Build updater latest.json)")) | "\(.conclusion)\t\(.name)"')
          echo "$jobs"
          if [[ -z "$jobs" ]] || grep -qv '^success' <<< "$jobs"; then
            echo "::error::Release builds did not all succeed; nothing is published to npm"
            exit 1
          fi

      - name: Download release metadata
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-meta
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Resolve version and npm dist-tag
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            raw=$(node -p "require('./release-meta.json').tag")
            sha="$RUN_SHA"
          else
            raw="$INPUT_VERSION"
            sha="$GITHUB_SHA"
          fi
          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$raw' is not a version of the form X.Y.Z or X.Y.Z-pre"
            exit 1
          fi
          if [[ "$version" == *-* ]]; then dist_tag=next; else dist_tag=latest; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build-cli:
    name: CLI (${{ matrix.target }})
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: risuko
            npm_dir: darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            binary: risuko
            npm_dir: darwin-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            binary: risuko
            npm_dir: linux-x64-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            binary: risuko
            npm_dir: linux-arm64-gnu
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: risuko.exe
            npm_dir: win32-x64-msvc
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            binary: risuko.exe
            npm_dir: win32-arm64-msvc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.meta.outputs.sha }}

      - name: Stamp release version
        run: node scripts/set-version.mjs "${{ needs.meta.outputs.version }}"

      - name: Setup Rust for ${{ matrix.target }}
        uses: ./.github/actions/setup-rust-target
        with:
          target: ${{ matrix.target }}
          cache-key: cli-${{ matrix.target }}

      - name: Build risuko-cli
        if: runner.os != 'Linux'
        working-directory: src-tauri
        run: cargo build --release --locked --target ${{ matrix.target }} -p risuko-cli

      - name: Build risuko-cli (glibc 2.17)
        if: runner.os == 'Linux'
        uses: ./.github/actions/build-cli-glibc
        with:
          target: ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cli-${{ matrix.npm_dir }}
          path: src-tauri/target/${{ matrix.target }}/release/${{ matrix.binary }}

  build-napi:
    name: NAPI (${{ matrix.target }})
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            node_file: risuko.darwin-arm64.node
            npm_dir: darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            node_file: risuko.darwin-x64.node
            npm_dir: darwin-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            node_file: risuko.linux-x64-gnu.node
            npm_dir: linux-x64-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            node_file: risuko.linux-arm64-gnu.node
            npm_dir: linux-arm64-gnu
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            node_file: risuko.win32-x64-msvc.node
            npm_dir: win32-x64-msvc
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            node_file: risuko.win32-arm64-msvc.node
            npm_dir: win32-arm64-msvc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.meta.outputs.sha }}

      - name: Stamp release version
        run: node scripts/set-version.mjs "${{ needs.meta.outputs.version }}"

      - name: Setup Rust for ${{ matrix.target }}
        uses: ./.github/actions/setup-rust-target
        with:
          target: ${{ matrix.target }}
          cache-key: napi-${{ matrix.target }}

      - name: Build risuko-napi
        if: runner.os != 'Linux'
        working-directory: src-tauri
        run: cargo build --release --locked --target ${{ matrix.target }} -p risuko-napi

      - name: Build risuko-napi (glibc 2.17)
        if: runner.os == 'Linux'
        uses: ./.github/actions/build-cli-glibc
        with:
          target: ${{ matrix.target }}
          package: risuko-napi
          artifact: librisuko_napi.so

      - name: Rename .node artifact
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            src="src-tauri/target/${{ matrix.target }}/release/risuko_napi.dll"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            src="src-tauri/target/${{ matrix.target }}/release/librisuko_napi.dylib"
          else
            src="src-tauri/target/${{ matrix.target }}/release/librisuko_napi.so"
          fi
          cp "$src" "${{ matrix.node_file }}"

      - name: Upload .node artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: napi-${{ matrix.npm_dir }}
          path: ${{ matrix.node_file }}

  publish:
    name: Publish to npm
    needs: [meta, build-cli, build-napi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.meta.outputs.sha }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download all CLI artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: cli-*
          path: artifacts/cli

      - name: Download all NAPI artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: napi-*
          path: artifacts/napi

      - name: Set version in all package.json files
        run: node scripts/set-version.mjs "${{ needs.meta.outputs.version }}"

      - name: Stage CLI platform packages
        shell: bash
        run: |
          set -euo pipefail
          for dir in packages/risuko-cli/npm/*/; do
            platform=$(basename "$dir")
            echo "Staging CLI binary for $platform"
            artifact_dir="artifacts/cli/cli-${platform}"
            if [ ! -d "$artifact_dir" ]; then
              echo "::error::No CLI artifact for $platform"
              exit 1
            fi
            cp "$artifact_dir"/* "$dir"
            chmod +x "$dir"risuko 2>/dev/null || true
            ls -la "$dir"
          done

      - name: Stage NAPI platform packages
        shell: bash
        run: |
          set -euo pipefail
          for dir in packages/risuko-js/npm/*/; do
            platform=$(basename "$dir")
            echo "Staging NAPI module for $platform"
            artifact_dir="artifacts/napi/napi-${platform}"
            if [ ! -d "$artifact_dir" ]; then
              echo "::error::No NAPI artifact for $platform"
              exit 1
            fi
            cp "$artifact_dir"/* "$dir"
            ls -la "$dir"
          done

      - name: Publish packages
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          DIST_TAG: ${{ needs.meta.outputs.dist_tag }}
        run: |
          set -euo pipefail
          publish() {
            local dir="$1" name
            name=$(node -p "require('./$dir/package.json').name")
            if [[ "$(npm view "$name@$VERSION" version 2>/dev/null || true)" == "$VERSION" ]]; then
              echo "$name@$VERSION is already published, skipping"
              return
            fi
            echo "Publishing $name@$VERSION ($DIST_TAG)"
            local log="$RUNNER_TEMP/npm-publish.log"
            if ! (cd "$dir" && npm publish --access public --provenance --tag "$DIST_TAG") 2>&1 | tee "$log"; then
              if grep -qF "previously staged version \"$VERSION\"" "$log"; then
                echo "::warning::$name@$VERSION is already staged on npm and not visible yet, skipping"
                return
              fi
              return 1
            fi
          }
          for dir in packages/risuko-cli/npm/*/ packages/risuko-js/npm/*/; do
            publish "${dir%/}"
          done
          publish packages/risuko-cli
          publish packages/risuko-js
          publish packages/risuko-app

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          DIST_TAG: ${{ needs.meta.outputs.dist_tag }}
        run: |
          set -euo pipefail
          echo "## Dry run: would publish with dist-tag $DIST_TAG" >> "$GITHUB_STEP_SUMMARY"
          for dir in packages/risuko-cli/npm/*/ packages/risuko-js/npm/*/ packages/risuko-cli packages/risuko-js packages/risuko-app; do
            pkg=$(node -p "require('./${dir%/}/package.json').name")
            echo "- $pkg@$VERSION" >> "$GITHUB_STEP_SUMMARY"
          done
