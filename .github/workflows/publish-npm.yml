name: Publish npm packages

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.2)'
        required: true
      dry_run:
        description: 'Dry run (skip actual publish)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  id-token: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  meta:
    name: Resolve version
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'release'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Require every app build of the release to have succeeded
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          jobs=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
            --jq '.jobs[] | select(.name | test("^(Release \\(|Build updater latest.json)")) | "\(.conclusion)\t\(.name)"')
          echo "$jobs"
          if [[ -z "$jobs" ]] || grep -qv '^success' <<< "$jobs"; then
            echo "::error::Release builds did not all succeed; nothing is published to npm"
            exit 1
          fi

      - name: Download release metadata
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: release-meta
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Resolve version and npm dist-tag
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            raw=$(node -p "require('./release-meta.json').tag")
            sha="$RUN_SHA"
          else
            raw="$INPUT_VERSION"
            sha="$GITHUB_SHA"
          fi
          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$raw' is not a version of the form X.Y.Z or X.Y.Z-pre"
            exit 1
          fi
          if [[ "$version" == *-* ]]; then dist_tag=next; else dist_tag=latest; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build-cli:
    name: CLI (${{ matrix.target }})
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: risuko
            npm_dir: darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            binary: risuko
            npm_dir: darwin-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            binary: risuko
            npm_dir: linux-x64-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            binary: risuko
            npm_dir: linux-arm64-gnu
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: risuko.exe
            npm_dir: win32-x64-msvc
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            binary: risuko.exe
            npm_dir: win32-arm64-msvc

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}

      - name: Stamp release version
        run: node scripts/set-version.mjs "${{ needs.meta.outputs.version }}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: ${{ matrix.target == 'aarch64-pc-windows-msvc' && 'amd64_arm64' || 'amd64' }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: src-tauri -> target
          key: cli-${{ matrix.target }}

      - name: Install Linux build deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Build risuko-cli
        working-directory: src-tauri
        run: cargo build --release --target ${{ matrix.target }} -p risuko-cli

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.npm_dir }}
          path: src-tauri/target/${{ matrix.target }}/release/${{ matrix.binary }}

  build-napi:
    name: NAPI (${{ matrix.target }})
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            node_file: risuko.darwin-arm64.node
            npm_dir: darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            node_file: risuko.darwin-x64.node
            npm_dir: darwin-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            node_file: risuko.linux-x64-gnu.node
            npm_dir: linux-x64-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            node_file: risuko.linux-arm64-gnu.node
            npm_dir: linux-arm64-gnu
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            node_file: risuko.win32-x64-msvc.node
            npm_dir: win32-x64-msvc
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            node_file: risuko.win32-arm64-msvc.node
            npm_dir: win32-arm64-msvc

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}

      - name: Stamp release version
        run: node scripts/set-version.mjs "${{ needs.meta.outputs.version }}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: ${{ matrix.target == 'aarch64-pc-windows-msvc' && 'amd64_arm64' || 'amd64' }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: src-tauri -> target
          key: napi-${{ matrix.target }}

      - name: Install Linux build deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Build risuko-napi
        working-directory: src-tauri
        run: cargo build --release --target ${{ matrix.target }} -p risuko-napi

      - name: Rename .node artifact
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            src="src-tauri/target/${{ matrix.target }}/release/risuko_napi.dll"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            src="src-tauri/target/${{ matrix.target }}/release/librisuko_napi.dylib"
          else
            src="src-tauri/target/${{ matrix.target }}/release/librisuko_napi.so"
          fi
          cp "$src" "${{ matrix.node_file }}"

      - name: Upload .node artifact
        uses: actions/upload-artifact@v4
        with:
          name: napi-${{ matrix.npm_dir }}
          path: ${{ matrix.node_file }}

  publish:
    name: Publish to npm
    needs: [meta, build-cli, build-napi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download all CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: artifacts/cli

      - name: Download all NAPI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: napi-*
          path: artifacts/napi

      - name: Set version in all package.json files
        run: node scripts/set-version.mjs "${{ needs.meta.outputs.version }}"

      - name: Stage CLI platform packages
        shell: bash
        run: |
          set -euo pipefail
          for dir in packages/risuko-cli/npm/*/; do
            platform=$(basename "$dir")
            echo "Staging CLI binary for $platform"
            artifact_dir="artifacts/cli/cli-${platform}"
            if [ ! -d "$artifact_dir" ]; then
              echo "::error::No CLI artifact for $platform"
              exit 1
            fi
            cp "$artifact_dir"/* "$dir"
            chmod +x "$dir"risuko 2>/dev/null || true
            ls -la "$dir"
          done

      - name: Stage NAPI platform packages
        shell: bash
        run: |
          set -euo pipefail
          for dir in packages/risuko-js/npm/*/; do
            platform=$(basename "$dir")
            echo "Staging NAPI module for $platform"
            artifact_dir="artifacts/napi/napi-${platform}"
            if [ ! -d "$artifact_dir" ]; then
              echo "::error::No NAPI artifact for $platform"
              exit 1
            fi
            cp "$artifact_dir"/* "$dir"
            ls -la "$dir"
          done

      - name: Publish packages
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          DIST_TAG: ${{ needs.meta.outputs.dist_tag }}
        run: |
          set -euo pipefail
          publish() {
            local dir="$1" name
            name=$(node -p "require('./$dir/package.json').name")
            if [[ "$(npm view "$name@$VERSION" version 2>/dev/null || true)" == "$VERSION" ]]; then
              echo "$name@$VERSION is already published, skipping"
              return
            fi
            echo "Publishing $name@$VERSION ($DIST_TAG)"
            (cd "$dir" && npm publish --access public --provenance --tag "$DIST_TAG")
          }
          for dir in packages/risuko-cli/npm/*/ packages/risuko-js/npm/*/; do
            publish "${dir%/}"
          done
          publish packages/risuko-cli
          publish packages/risuko-js
          publish packages/risuko-app

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          DIST_TAG: ${{ needs.meta.outputs.dist_tag }}
        run: |
          set -euo pipefail
          echo "## Dry run: would publish with dist-tag $DIST_TAG" >> "$GITHUB_STEP_SUMMARY"
          for dir in packages/risuko-cli/npm/*/ packages/risuko-js/npm/*/ packages/risuko-cli packages/risuko-js packages/risuko-app; do
            pkg=$(node -p "require('./${dir%/}/package.json').name")
            echo "- $pkg@$VERSION" >> "$GITHUB_STEP_SUMMARY"
          done
