name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      desktop_matrix: ${{ steps.targets.outputs.desktop_matrix }}
      android_targets: ${{ steps.targets.outputs.android_targets }}
      android_rust_targets: ${{ steps.targets.outputs.android_rust_targets }}
      android_abis: ${{ steps.targets.outputs.android_abis }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            tag="$RELEASE_TAG"
          else
            tag="v$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/.*"\(.*\)"/\1/')"
          fi
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$tag' is not of the form vX.Y.Z or vX.Y.Z-pre"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (tag $tag)"
          printf '{"tag":"%s","version":"%s"}\n' "$tag" "$version" > release-meta.json

      - name: Select build targets
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          all='[
            {"platform":"darwin/x64","os":"macos-latest","target":"x86_64-apple-darwin","tauri_args":"--config src-tauri/tauri.darwin.x64.conf.json"},
            {"platform":"darwin/arm64","os":"macos-latest","target":"aarch64-apple-darwin","tauri_args":"--config src-tauri/tauri.darwin.arm64.conf.json"},
            {"platform":"linux/x64","os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","tauri_args":"--config src-tauri/tauri.linux.x64.conf.json"},
            {"platform":"linux/arm64","os":"ubuntu-22.04-arm","target":"aarch64-unknown-linux-gnu","tauri_args":"--config src-tauri/tauri.linux.arm64.conf.json"},
            {"platform":"win32/x64","os":"windows-latest","target":"x86_64-pc-windows-msvc","tauri_args":"--config src-tauri/tauri.win32.x64.conf.json"},
            {"platform":"win32/ia32","os":"windows-latest","target":"i686-pc-windows-msvc","tauri_args":"--config src-tauri/tauri.win32.ia32.conf.json"}
          ]'
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            platforms='["darwin/x64","darwin/arm64","linux/x64","linux/arm64","win32/x64","win32/ia32"]'
            android_targets=""
            android_rust_targets="aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android"
            android_abis="arm arm64 x86 x86_64"
          else
            platforms='["darwin/x64","win32/x64"]'
            android_targets="--target aarch64"
            android_rust_targets="aarch64-linux-android"
            android_abis="arm64"
          fi
          matrix=$(jq -c --argjson p "$platforms" '{include: [.[] | select(.platform as $x | $p | index($x))]}' <<< "$all")
          echo "desktop_matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "android_targets=$android_targets" >> "$GITHUB_OUTPUT"
          echo "android_rust_targets=$android_rust_targets" >> "$GITHUB_OUTPUT"
          echo "android_abis=$android_abis" >> "$GITHUB_OUTPUT"
          echo "Desktop: $(jq -r '[.include[].platform] | join(", ")' <<< "$matrix"); Android: $android_abis"

      - name: Upload release metadata
        if: github.event_name == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-meta
          path: release-meta.json

  android-release:
    name: Release (android)
    needs: meta
    runs-on: ubuntu-22.04
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Stamp release version
        run: node scripts/set-version.mjs "${{ needs.meta.outputs.version }}"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Setup Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ needs.meta.outputs.android_rust_targets }}

      - name: Cache Rust (cargo registry + build artifacts)
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: "src-tauri -> target"
          key: android

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Android release APKs
        shell: bash
        run: pnpm android:build $ANDROID_TARGETS
        env:
          ANDROID_TARGETS: ${{ needs.meta.outputs.android_targets }}
          ANDROID_NDK_VERSION: 27.2.12479018
          ANDROID_API_LEVEL: 24

      - name: Sign Android release APKs
        if: ${{ !github.event.pull_request.head.repo.fork }}
        run: pnpm android:sign
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

      - name: Package Android APKs with standardized names
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.meta.outputs.version }}"
          abis="${{ needs.meta.outputs.android_abis }}"
          suffix="${{ github.event.pull_request.head.repo.fork && '-unsigned' || '' }}"
          mkdir -p dist/android
          declare -A labels=(
            [arm]=arm
            [arm64]=arm64
            [x86]=x86
            [x86_64]=x64
          )
          for abi in $abis; do
            src="src-tauri/gen/android/app/build/outputs/apk/${abi}/release/app-${abi}-release${suffix}.apk"
            if [[ ! -f "$src" ]]; then
              echo "::error::Signed Android APK not found: $src"
              find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print || true
              exit 1
            fi
            dest="dist/android/Risuko_${version}_android_${labels[$abi]}.apk"
            cp "$src" "$dest"
            echo "packaged: $dest"
          done

      - name: Upload Android APKs to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          files: dist/android/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Android APK artifacts (manual builds)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-android
          path: dist/android/*.apk

  release:
    name: Release (${{ matrix.platform }})
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.meta.outputs.desktop_matrix) }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Stamp release version
        run: node scripts/set-version.mjs "${{ needs.meta.outputs.version }}"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: ${{ matrix.target == 'i686-pc-windows-msvc' && 'x86' || 'amd64' }}

      - name: Cache Rust (cargo registry + build artifacts)
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            file
          mkdir -p "$HOME/.cache/tauri"
          plugin="$HOME/.cache/tauri/linuxdeploy-plugin-gtk.sh"
          source_plugin="$HOME/.cache/tauri/linuxdeploy-plugin-gtk.upstream.sh"
          plugin_url="https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/b5eb8d05b4c0ed40107fe2158c5d8527f94568ef/linuxdeploy-plugin-gtk.sh"
          expected_sha256="cb379f9b0733e9ad9f8bd78f8c2fa038aef2478523bb7d4c8e64ff6a1ea3501a"
          if [ ! -f "$source_plugin" ]; then
            curl -fsSL -o "$source_plugin" \
              "$plugin_url"
          fi
          actual_sha256="$(sha256sum "$source_plugin" | awk '{print $1}')"
          if [ "$actual_sha256" != "$expected_sha256" ]; then
            echo "::error::linuxdeploy-plugin-gtk.sh checksum mismatch"
            exit 1
          fi
          cp "$source_plugin" "$plugin"
          chmod +x "$plugin"
          sed -i 's/ln $verbose -s /ln $verbose -sfn /' "$plugin"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inject updater public key from secrets
        if: github.event_name == 'release'
        run: |
          node -e "const fs=require('node:fs');const p='src-tauri/tauri.conf.json';const key=(process.env.TAURI_UPDATER_PUBKEY||'').trim();if(!key){console.error('TAURI_UPDATER_PUBKEY secret is required for tagged releases');process.exit(1);}const c=JSON.parse(fs.readFileSync(p,'utf8'));c.plugins??={};c.plugins.updater??={};c.plugins.updater.pubkey=key;c.bundle??={};c.bundle.createUpdaterArtifacts=true;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');console.log('Enabled updater artifacts + injected pubkey into tauri.conf.json for this workflow run.');"
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}

      - name: Build release artifacts (tag)
        if: github.event_name == 'release'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        with:
          args: --target ${{ matrix.target }} ${{ matrix.tauri_args }}
          includeUpdaterJson: false
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TEAM_ID: ${{ secrets.team_id }}
          APPLE_ID: ${{ secrets.apple_id }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.apple_app_specific_password }}

      - name: Build release artifacts (manual)
        if: github.event_name != 'release'
        run: pnpm tauri build --target ${{ matrix.target }} ${{ matrix.tauri_args }}

      - name: Verify local bundle output exists
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ ! -d "$bundle_dir" ]; then
            echo "::error::No bundle output found at $bundle_dir"
            ls -la "src-tauri/target/${{ matrix.target }}/release" || true
            exit 1
          fi
          find "$bundle_dir" -maxdepth 3 -type f | sed 's/^/built: /'

      - name: Package canonical desktop assets
        shell: bash
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}
          MATRIX_TARGET: ${{ matrix.target }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          RELEASE_TAGGED: ${{ github.event_name == 'release' }}
        run: node scripts/package-release-assets.mjs

      - name: Write app bundle SHA-256 sidecar
        shell: bash
        run: |
          set -euo pipefail
          node scripts/write-sha256-sidecar.mjs "$APP_ASSET"

      - name: Write plain Linux AppImage SHA-256 sidecar
        if: runner.os == 'Linux' && github.event_name == 'release' && env.PLAIN_APPIMAGE_ASSET != ''
        shell: bash
        run: |
          set -euo pipefail
          node scripts/write-sha256-sidecar.mjs "$PLAIN_APPIMAGE_ASSET"

      - name: Emit updater manifest fragment
        if: github.event_name == 'release'
        shell: bash
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          APP_ASSET: ${{ env.APP_ASSET }}
          UPDATER_SIG_FILE: ${{ env.UPDATER_SIG_FILE }}
        run: |
          set -euo pipefail
          triple="$MATRIX_TARGET"
          arch="${triple%%-*}"
          case "$triple" in
            *apple-darwin) tos=darwin ;;
            *windows*)     tos=windows ;;
            *linux*)       tos=linux ;;
            *) echo "::error::unknown target triple $triple"; exit 1 ;;
          esac
          key="${tos}-${arch}"
          signature=$(tr -d '\n' < "$UPDATER_SIG_FILE")
          mkdir -p fragments
          printf '{"key":"%s","asset":"%s","signature":"%s"}' "$key" "$APP_ASSET" "$signature" > "fragments/$key.json"
          echo "fragment: fragments/${key}.json -> $APP_ASSET"

      - name: Upload updater fragment
        if: github.event_name == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: updater-fragment-${{ matrix.target }}
          path: fragments/*.json

      - name: Upload standardized app bundle to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          files: |
            ${{ env.APP_ASSET }}
            ${{ env.APP_ASSET }}.sha256
            ${{ env.APP_ASSET }}.sig
            ${{ env.EXTRA_APP_ASSETS }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload standardized app bundle artifact (manual builds)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-${{ env.APP_PLATFORM_LABEL }}
          path: |
            ${{ env.APP_ASSET }}
            ${{ env.APP_ASSET }}.sha256

      - name: Write Windows portable SHA-256 sidecar
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/write-sha256-sidecar.mjs "$PORTABLE_ASSET"

      - name: Upload Windows portable exe to GitHub Release
        if: runner.os == 'Windows' && github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          files: |
            ${{ env.PORTABLE_ASSET }}
            ${{ env.PORTABLE_ASSET }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows portable exe artifact (manual builds)
        if: runner.os == 'Windows' && github.event_name != 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-portable-${{ env.APP_PLATFORM_LABEL }}
          path: |
            ${{ env.PORTABLE_ASSET }}
            ${{ env.PORTABLE_ASSET }}.sha256

      - name: Build risuko-cli binary
        if: matrix.target != 'i686-pc-windows-msvc'
        working-directory: src-tauri
        run: cargo build --release --target ${{ matrix.target }} -p risuko-cli

      - name: Package risuko-cli binary (unix)
        if: matrix.target != 'i686-pc-windows-msvc' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bin="src-tauri/target/${{ matrix.target }}/release/risuko"
          chmod +x "$bin"
          case "${{ matrix.platform }}" in
            darwin/arm64) label="darwin-arm64" ;;
            darwin/x64)   label="darwin-x64" ;;
            linux/x64)    label="linux-x64" ;;
            linux/arm64)  label="linux-arm64" ;;
            *)            label="${{ matrix.target }}" ;;
          esac
          tar czf "risuko-cli-${label}.tar.gz" -C "$(dirname "$bin")" risuko
          echo "CLI_ASSET=risuko-cli-${label}.tar.gz" >> "$GITHUB_ENV"

      - name: Package risuko-cli binary (windows)
        if: matrix.target != 'i686-pc-windows-msvc' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "src-tauri/target/${{ matrix.target }}/release/risuko.exe"
          $label = "win32-x64"
          if ("${{ matrix.target }}" -match "aarch64") { $label = "win32-arm64" }
          Compress-Archive -Path $bin -DestinationPath "risuko-cli-${label}.zip"
          echo "CLI_ASSET=risuko-cli-${label}.zip" >> $env:GITHUB_ENV

      - name: Upload risuko-cli to GitHub Release
        if: github.event_name == 'release' && matrix.target != 'i686-pc-windows-msvc'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          files: ${{ env.CLI_ASSET }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload risuko-cli artifact (manual builds)
        if: github.event_name != 'release' && matrix.target != 'i686-pc-windows-msvc'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: risuko-cli-${{ matrix.target }}
          path: ${{ env.CLI_ASSET }}

      - name: Dump macOS DMG diagnostics on failure
        if: failure() && startsWith(matrix.platform, 'darwin')
        shell: bash
        run: |
          set -euxo pipefail
          dmg_dir="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          if [ -d "$dmg_dir" ]; then
            echo "== DMG bundle directory =="
            ls -la "$dmg_dir" || true
            if [ -f "$dmg_dir/bundle_dmg.sh" ]; then
              echo "== bundle_dmg.sh =="
              sed -n '1,260p' "$dmg_dir/bundle_dmg.sh" || true
            fi
            for f in "$dmg_dir"/*.log; do
              if [ -f "$f" ]; then
                echo "== log: $f =="
                cat "$f" || true
              fi
            done
          else
            echo "DMG directory not found: $dmg_dir"
          fi

  updater-manifest:
    name: Build updater latest.json
    needs: [meta, release]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Download updater fragments
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: fragments
          pattern: updater-fragment-*
          merge-multiple: true

      - name: Build latest.json
        shell: bash
        run: node scripts/build-updater-manifest.mjs fragments latest.json
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          REPO: ${{ github.repository }}

      - name: Upload latest.json to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.meta.outputs.tag }}" latest.json --clobber --repo "${{ github.repository }}"

  homebrew:
    name: Bump Homebrew tap
    needs: [meta, release, updater-manifest]
    if: github.event_name == 'release' && !github.event.release.prerelease
    uses: ./.github/workflows/bump-homebrew-tap.yml
    with:
      tag: ${{ needs.meta.outputs.tag }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  sync-version:
    name: Commit version bump
    needs: [meta, release, android-release, updater-manifest]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Resolve release branch
        id: branch
        shell: bash
        env:
          TARGET: ${{ github.event.release.target_commitish }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/branches/$TARGET" >/dev/null 2>&1; then
            echo "name=$TARGET" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Release target '$TARGET' is not a branch; skipping the version bump commit"
          fi

      - name: Check out release branch
        if: steps.branch.outputs.name != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.name }}

      - name: Commit and push the version bump
        if: steps.branch.outputs.name != ''
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          BRANCH: ${{ steps.branch.outputs.name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/set-version.mjs "$VERSION"
          if git diff --quiet; then
            echo "Manifests already at $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$VERSION"
          if git push origin "HEAD:$BRANCH"; then
            exit 0
          fi
          pr_branch="release/v$VERSION"
          git push --force origin "HEAD:refs/heads/$pr_branch"
          gh pr create --base "$BRANCH" --head "$pr_branch" \
            --title "chore(release): v$VERSION" \
            --body "Version bump for the v$VERSION release, opened because the direct push to $BRANCH was rejected."
