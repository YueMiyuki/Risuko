[package]
name = "risuko-cookies"
version.workspace = true
description = "Browser cookie extraction for Risuko"
authors.workspace = true
edition.workspace = true
license = "MIT"

[lib]
name = "risuko_cookies"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt", "fs"] }
url = "2"
eyre = "0.6"
glob = "0.3"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
regex = "1"

[target.'cfg(not(target_os = "android"))'.dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
base64 = { version = "0.23", features = ["std"] }
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
cipher = { version = "0.5", features = ["alloc", "block-padding"] }
pbkdf2 = "0.13"
sha1 = "0.11"

[target.'cfg(target_os = "windows")'.dependencies]
aes-gcm = { version = "0.11.0-rc.4", features = ["aes", "alloc"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
