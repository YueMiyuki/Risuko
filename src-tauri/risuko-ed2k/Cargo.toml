[package]
name = "risuko-ed2k"
version.workspace = true
description = "eD2k and Kademlia download engine used by Risuko"
authors.workspace = true
edition.workspace = true
license = "MIT"

[lib]
name = "risuko_ed2k"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "net", "macros", "io-util", "fs"] }
hex = "0.4"
parking_lot = "0.12"
thiserror = "2"
percent-encoding = "2"
tracing = "0.1"
risuko-util = { workspace = true }
risuko-http = { workspace = true }
futures-util = "0.3"
rand = "0.10"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
flate2 = "1.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
