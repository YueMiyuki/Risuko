[package]
name = "risuko-napi"
version.workspace = true
description = "Risuko download engine — Node.js native bindings"
authors.workspace = true
edition.workspace = true
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
risuko-engine = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = "0.1"
napi = { version = "3", features = ["async", "serde-json", "tokio_rt"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
