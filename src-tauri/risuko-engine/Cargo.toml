[package]
name = "risuko-engine"
version.workspace = true
description = "Risuko download engine — multi-protocol download library"
authors = ["YueMiyuki"]
edition = "2021"
license = "MIT"

[lib]
name = "risuko_engine"

[package.metadata.cargo-machete]
ignored = ["md-5"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "sync", "time", "rt", "net", "macros", "io-util", "fs"] }
hex = "0.4"
httpdate = "1"
parking_lot = "0.12"
thiserror = "2"
percent-encoding = "2"
tracing = "0.1"
dirs = "6"
sha1 = "0.11"
sha2 = "0.11"
md-5 = "0.11"
hmac = "0.13"
risuko-bt = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
futures-util = "0.3"
rand = "0.10"
tower-http = { version = "0.7", features = ["cors"] }
risuko-http = { workspace = true }
tokio-util = { version = "0.7", features = ["io"] }
async-trait = "0.1"
bytes = "1"
tempfile = "3"
rust-par2 = "=0.1.3"
fs4 = "1"
url = "2"
m3u8-rs = "6.0.0"
quick-xml = { version = "0.40", features = ["serialize"] }
aes = "0.9"
cbc = "0.2"
feed-rs = "2.3.1"
regex = "1.12.4"
glob = "0.3"
globset = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
suppaftp = { version = "9", features = ["tokio-rustls-ring", "deprecated"] }
russh = { version = "0.61", default-features = false, features = ["ring", "flate2"] }
flate2 = "1.1"
russh-sftp = "2"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", features = ["fs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["full", "test-util"] }
