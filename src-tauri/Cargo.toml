[workspace]
members = ["risuko-engine", "risuko-bt", "risuko-ed2k", "risuko-util", "risuko-tauri", "risuko-cli", "risuko-napi", "risuko-http", "risuko-cookies", "risuko-webview-upgrade", "risuko-share"]

[workspace.package]
version = "1.0.0"
authors = ["YueMiyuki"]
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
risuko-engine = { path = "risuko-engine" }
risuko-bt = { path = "risuko-bt" }
risuko-ed2k = { path = "risuko-ed2k" }
risuko-util = { path = "risuko-util" }
risuko-tauri = { path = "risuko-tauri" }
risuko-cli = { path = "risuko-cli" }
risuko-http = { path = "risuko-http" }
risuko-cookies = { path = "risuko-cookies" }
risuko-webview-upgrade = { path = "risuko-webview-upgrade" }
risuko-share = { path = "risuko-share" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "sync", "time", "rt", "net", "macros", "signal", "io-util"] }
clap = { version = "4", features = ["derive"] }
tauri = { version = "2", features = [
	"tray-icon",
	"image-png",
	"macos-private-api",
] }
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = { version = "2", default-features = false, features = [
	"xdg-portal",
] }
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-barcode-scanner = "2.4.5"

[package]
name = "risuko"
version.workspace = true
description = "A full-featured download manager"
authors.workspace = true
edition.workspace = true

[lib]
name = "risuko_lib"
crate-type = ["lib", "cdylib"]

[lints.rust]
linker_messages = "allow"

[package.metadata.cargo-machete]
ignored = [
	"serde_json",
	"tauri-plugin-store",
	"tauri-plugin-deep-link",
	"tauri-plugin-dialog",
	"tauri-plugin-shell",
	"tauri-plugin-clipboard-manager",
	"tauri-plugin-autostart",
	"tauri-plugin-single-instance",
	"tauri-plugin-notification",
	"tauri-plugin-process",
	"tauri-plugin-updater",
	"tauri-plugin-barcode-scanner",
	"risuko-webview-upgrade",
	"reqwest",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = "line-tables-only"

[dependencies]
risuko-tauri = { workspace = true }
tauri = { workspace = true }
tauri-plugin-store = { workspace = true }
tauri-plugin-deep-link = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-shell = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-autostart = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-notification = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-process = { workspace = true }
tauri-plugin-updater = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["socks"] }

[target.'cfg(target_os = "android")'.dependencies]
risuko-webview-upgrade = { workspace = true }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = { workspace = true }
