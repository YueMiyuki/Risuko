[workspace]
members = ["risuko-engine", "risuko-bt", "risuko-cli", "risuko-napi", "risuko-http", "risuko-cookies", "risuko-webview-upgrade", "risuko-share"]

[workspace.package]
version = "1.0.0"
authors = ["YueMiyuki"]
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
risuko-engine = { path = "risuko-engine" }
risuko-bt = { path = "risuko-bt" }
risuko-http = { path = "risuko-http" }
risuko-cookies = { path = "risuko-cookies" }
risuko-webview-upgrade = { path = "risuko-webview-upgrade" }
risuko-share = { path = "risuko-share" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "sync", "time", "rt", "net", "macros", "signal", "io-util"] }
dirs = "6"
clap = { version = "4", features = ["derive"] }

[package]
name = "risuko"
version.workspace = true
description = "A full-featured download manager"
authors.workspace = true
edition.workspace = true

[lib]
name = "risuko_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[lints.rust]
linker_messages = "allow"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
split-debuginfo = "unpacked"

[dependencies]
risuko-engine = { workspace = true }
risuko-bt = { workspace = true }
risuko-share = { workspace = true }
risuko-cli = { path = "risuko-cli" }
tauri = { version = "2", features = [
	"tray-icon",
	"image-png",
	"macos-private-api",
] }
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = { version = "2", default-features = false, features = [
	"xdg-portal",
] }
tauri-plugin-shell = "2"
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
dirs = { workspace = true }
open = "5"
tauri-plugin-clipboard-manager = "2.3.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
risuko-http = { workspace = true }
risuko-cookies = { workspace = true }
base64 = "0.22"
percent-encoding = "2"
sha1 = "0.11"
keyring-core = "1"
fs4 = "1"
tempfile = "3"
async-trait = "0.1"
futures-util = "0.3"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "libc"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Storage_FileSystem",
	"Win32_System_Threading",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
trash = "5"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard = "2.1.11"
tauri-plugin-notification = "2"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
reqwest = { version = "0.13", default-features = false, features = ["socks"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk-context = "0.1"
risuko-webview-upgrade = { workspace = true }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.4.5"

[dev-dependencies]
