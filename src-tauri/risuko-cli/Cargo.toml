[package]
name = "risuko-cli"
version.workspace = true
description = "Risuko download engine — standalone CLI"
authors.workspace = true
edition.workspace = true
license = "MIT"

[[bin]]
name = "risuko"
path = "src/main.rs"

[dependencies]
risuko-engine = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
risuko-http = { workspace = true }
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
