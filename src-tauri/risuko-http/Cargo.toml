[package]
name = "risuko-http"
version.workspace = true
description = "Minimal HTTP client used by Risuko"
authors.workspace = true
edition.workspace = true
license = "MIT"

[lib]
name = "risuko_http"

[dependencies]
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio", "http1", "http2"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "sync", "macros", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
url = "2"
percent-encoding = "2"
futures-util = "0.3"
tower-service = "0.3"
thiserror = "2"
async-compression = { version = "0.4", features = ["tokio", "gzip", "brotli", "zlib"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
socket2 = { version = "0.6", features = ["all"] }
cookie_store = "0.22"
cookie = "0.18"
base64 = "0.22"
async-stream = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
serial_test = "3"
