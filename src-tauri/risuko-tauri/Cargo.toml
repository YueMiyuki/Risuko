[package]
name = "risuko-tauri"
version.workspace = true
description = "Tauri shell for Risuko"
authors.workspace = true
edition.workspace = true

[dependencies]
risuko-engine = { workspace = true }
risuko-bt = { workspace = true }
risuko-share = { workspace = true }
risuko-cli = { workspace = true }
tauri = { workspace = true }
tauri-plugin-store = { workspace = true }
tauri-plugin-deep-link = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-shell = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
open = "5"
tauri-plugin-clipboard-manager = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
risuko-http = { workspace = true }
risuko-cookies = { workspace = true }
base64 = "0.22"
percent-encoding = "2"
sha1 = "0.11"
keyring-core = "1"
fs4 = "1"
tempfile = "3"
async-trait = "0.1"
futures-util = "0.3"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication", "NSPasteboard", "libc"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Storage_FileSystem",
	"Win32_System_Threading",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = "0.11"
notify-rust = "4"
gtk = "0.18"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
clipboard-rs = { version = "0.3", default-features = false, features = ["wayland"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
trash = "5"
tauri-plugin-autostart = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-notification = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-process = { workspace = true }
tauri-plugin-updater = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
risuko-webview-upgrade = { workspace = true }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = { workspace = true }
